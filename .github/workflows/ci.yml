# Continuous integration: the checks that need no ROM (tools/ci_norom.sh).
#
#   - no tracked file is ROM data or derived from it (tools/ci_rom_free.py)
#   - the Python tools: syntax, pyflakes, and their self-tests on synthetic
#     inputs (tools/ci_test_tools.py: the runlink split/build round trip,
#     runlink_syms, runlink_diff, progress)
#   - every C file in src/ compiles with IDO 5.3 at the project's flags,
#     through the Makefile's own rules, with placeholder assembly standing in
#     for INCLUDE_ASM (tools/ci_stub_asm.py); and `make nonmatching`
#
# No ROM, nothing derived from it and no secrets are used. The matching build
# (`make check`) and the ROM-name check (tools/check_names.py) need the ROM
# and stay local; see "Checks" in README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  norom:
    name: ROM-free checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # lib/ultralib, tools/asm-processor, tools/asm-differ

      - name: Packages (MIPS binutils)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends binutils-mips-linux-gnu

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # the Python venv, the IDO 5.3 recomp release and m2c, as for a user
      - name: make setup
        run: make setup

      - name: pyflakes
        run: .venv/bin/pip install -q pyflakes==3.2.0

      - name: ROM-free checks (tools/ci_norom.sh)
        run: bash tools/ci_norom.sh
