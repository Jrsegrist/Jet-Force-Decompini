  # DKR-style asset table: u32 count, then count+1 offsets relative to 0xB1880.
  - name: asset_lut
    type: bin
    start: 0xB1750
  - name: assets
    type: bin
    start: 0xB1880

  # Runlink: main's imports from modules, the global symbol table, the module
  # table and module images, and the symbol name pool.
  - name: runlink_main_imports
    type: bin
    start: 0x1ECF220
  - name: runlink_symtab
    type: bin
    start: 0x1ED0270
  - name: runlink_modtab
    type: bin
    start: 0x1ED2780
  - name: runlink_modules
    type: bin
    start: 0x1ED3B20
  - name: runlink_nameoffs
    type: bin
    start: 0x1FEB040
  - name: runlink_names
    type: bin
    start: 0x1FED550
  - [0x2000000]
