name: Jet Force Gemini (North America)
sha1: 493ced9008dbe932d6e91179b68e8630cf23a023
options:
  basename: jfg.us
  target_path: baserom.us.z64
  elf_path: build/jfg.us.elf
  base_path: .
  platform: n64
  compiler: IDO
  header_encoding: ASCII

  asm_path: asm
  asset_path: assets
  src_path: src
  build_path: build
  ld_script_path: jfg.us.ld
  ld_dependencies: False

  symbol_addrs_path:
    - symbol_addrs.us.txt
    - build/syms/runlink_syms.us.txt
  undefined_funcs_auto_path: build/syms/undefined_funcs_auto.us.txt
  undefined_syms_auto_path: build/syms/undefined_syms_auto.us.txt

  find_file_boundaries: True
  section_order: [".text", ".data", ".rodata", ".bss"]
  symbol_name_format: $VRAM
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  asm_emit_size_directive: False
  asm_inc_header: ""
  use_legacy_include_asm: False
  o_as_suffix: True
  create_undefined_funcs_auto: True
  create_undefined_syms_auto: True

  # C files are committed; splat must not create them. Every function gets its
  # own asm/nonmatchings/<file>/func_XXXXXXXX.s (named by address, see
  # tools/runlink_syms.py), whether or not the C file still includes it.
  create_c_files: False
  disassemble_all: True
  matchings_path: nonmatchings

segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  # Main code segment: uncompressed, loaded by IPL3 to 0x80000400.
  # Runlink module 0. Text 0x80000450-0x800A0660, data+rodata to 0x800B0B50,
  # bss 0x800B0B50-0x801059A0 (zeroed by the entry point).
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    bss_size: 0x54E50
    subsegments:
      - [0x1000, asm, entry]
      - [0x1050, c, audio]
      - [0x2610, c]
